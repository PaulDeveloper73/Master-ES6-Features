<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A JavaScript customer directory demonstrating API requests and ES modules."
    />

    <title>Customer Directory | Week 3</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./js/main.js"></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="page-header">
        <p class="eyebrow">WEEK 3 PROJECT</p>
        <h1>Customer Directory</h1>
        <p>Explore customer records loaded from a remote API.</p>
      </header>

      <section class="toolbar" aria-label="Contact controls">
        <label class="search-field" for="search">
          <span>Search contacts</span>
          <input
            id="search"
            type="search"
            placeholder="Search name, email or city..."
            autocomplete="off"
          />
        </label>

        <button id="reload" type="button">Reload contacts</button>
      </section>

      <p id="status" role="status" aria-live="polite">
        Preparing to load contacts...
      </p>

      <p id="error" class="error-message" role="alert" hidden></p>
      <p id="empty-state" class="empty-state" hidden></p>

      <section
        id="user-list"
        class="user-grid"
        aria-label="Customer records"
      ></section>
    </main>
  </body>
</html>
